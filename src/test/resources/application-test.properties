# ===============================
# = Test profile (activated by @ActiveProfiles("test") on the test classes)
# ===============================
# This is a PROFILE-SPECIFIC file, so Spring MERGES it over
# src/main/resources/application.properties: only the five keys below are
# overridden and everything else (dialect, Hikari, mail, redis, JWT, cleanup
# tuning, container keys, language list) is inherited.
#
# Do NOT move these keys into src/test/resources/application.properties.
# That file would SHADOW the main application.properties entirely, because
# test-classes precedes classes on the classpath, and the context would fail
# to start for want of all 197 lines of the real config. Keep it profile-specific.
#
# The datasource password stays inherited as ${ONELIKE_DB_PASSWORD}. Never
# inline a credential here: this file is committed.
#
# Reset procedure: DROP DATABASE onelike_test; the next test run rebuilds the
# schema from the entities (ddl-auto=update) via createDatabaseIfNotExist.
# ===============================
onelike.database.url=jdbc:mysql://localhost:3306/onelike_test?createDatabaseIfNotExist=true
onelike.database.searchnews=false
onelike.cleanup.enabled=false
onelike.database.proxies.enabled=false
onelike.containers.refresh.enabled=false
