# ===============================
# = Server
# ===============================
server.error.include-message=always
server.tomcat.connection-timeout=20000
server.tomcat.max-threads=2500
server.tomcat.accesslog.buffered=true
server.tomcat.accesslog.buffer-size=8192
server.tomcat.accesslog.delay=1000
server.tomcat.max-http-header-size=65536
server.tomcat.max-swallow-size=2097152

# ===============================
# = Data Compression
# ===============================

server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# ===============================
# = Cache
# ===============================

spring.resources.cache.cachecontrol.max-age=120
spring.resources.cache.cachecontrol.must-revalidate=true



# ===============================
# = application environment
# ===============================
onelike.database.url=jdbc:mysql://mysqldb:3306/onelike
onelike.database.username=root
onelike.database.password=${ONELIKE_DB_PASSWORD}
onelike.database.searchnews=true
onelike.database.proxies.enabled=true
spring.datasource.driver-class-name =com.mysql.cj.jdbc.Driver
# old 750 / new 750
onelike.database.feed.max=750
# mytalkers
onelike.database.fetchmytalkers.max=750
# other
onelike.database.fetch.max=1500

onelike.email.from=gdpr@onelike.app
onelike.email.team=info@onelike.app
onelike.email.report=report@onelike.app
onelike.report.reporttimes=15
onelike.report.suspendtimes=10
onelike.report.suspenddays=2

# ===============================
# = Spring environment
# ===============================
#spring.main.banner-mode=off
spring.output.ansi.console-available=true
server.error.include-stacktrace=never
spring.task.scheduling.pool.size=10

# ===============================
# = default connection pool
# ===============================
spring.datasource.hikari.connectionTimeout=30000
spring.datasource.hikari.maximumPoolSize=20
spring.datasource.hikari.idleTimeout=600000 
spring.datasource.hikari.maxLifetime=700000

# ===============================
# = Thymeleaf configurations
# ===============================
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# ===============================
# = JPA
# ===============================
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.batch_size=500

# ===============================
# = Cache cleanup
# ===============================
onelike.cleanup.enabled=true
onelike.cleanup.fixed-delay-ms=259200000
onelike.cleanup.initial-delay-ms=600000
onelike.cleanup.min-age-ms=259200000

# ===============================
# = User news containers
# ===============================
onelike.containers.max-themes-per-user=10
onelike.containers.block-max-age-ms=3600000
onelike.containers.refresh.enabled=true
onelike.containers.refresh.fixed-delay-ms=1800000
onelike.containers.refresh.initial-delay-ms=300000
onelike.containers.refresh.max-per-tick=5

# ===============================
# = Caching
# ===============================

# spring.cache.type=redis
# Enable cache expiration
# spring.cache.redis.time-to-live=60000
# Allows caching null values (optional)
# spring.cache.redis.cache-null-values=true
# Adds a prefix to keys (avoids collisions)
# spring.cache.redis.use-key-prefix=true

# spring.data.redis.host=redis
# spring.data.redis.port=6379


# Use Redis Sentinel instead of standalone mode
spring.data.redis.sentinel.master=mymaster
spring.data.redis.sentinel.nodes=redis-sentinel:26379
# Set if you have a password (otherwise leave empty)
spring.data.redis.password=
# Increase timeout for Sentinel failovers
spring.data.redis.timeout=5000
spring.data.redis.database=0

# Redis cache settings (optional)
onelike.redis.enabled=false
spring.cache.type=simple
spring.data.redis.time-to-live=60000
spring.data.redis.cache-null-values=true
spring.data.redis.use-key-prefix=true

# Connection pool optimization
#spring.data.redis.lettuce.pool.max-active=10
#spring.data.redis.lettuce.pool.max-idle=5
#spring.data.redis.lettuce.pool.min-idle=2
#spring.data.redis.lettuce.pool.time-between-eviction-runs=5000

# Custom fallback if Redis is not up
spring.cache.cache-names=news,news-ar,news-ch,news-de,news-es,news-fr,news-gr,news-hi,news-indo,news-it,news-jp,news-nl,news-pt,news-ru,news-tr,quotes,filter_news

# ===============================
# = MySQL
# ===============================
spring.datasource.url=${onelike.database.url}
spring.datasource.username=${onelike.database.username}
spring.datasource.password=${onelike.database.password}

spring.quartz.job-store-type=jdbc
spring.quartz.properties.org.quartz.threadPool.threadCount=10

# ===============================
# = E-Mail
# ===============================
spring.mail.host=smtp-relay.brevo.com
spring.mail.username=bayon2007@gmail.com
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.smtp.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ===============================
# = JWT
# ===============================

spring.security.oauth2.client.registration.google.clientId=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.clientSecret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.resourceserver.jwt.issuerUri=https://oauth2.googleapis.com/oauth2/v3/certs

jwt.secret=${JWT_SECRET}
jwt.expiration=31536000
onelike.database.password.default=${ONELIKE_DB_PASSWORD_DEFAULT}

#spring.security.oauth2.resourceserver.opaque-token.introspection-uri=https://www.googleapis-com
#spring.security.oauth2.resourceserver.opaque-token.clientId=${GOOGLE_CLIENT_ID}
#spring.security.oauth2.resourceserver.opaque-token.clientSecret=${GOOGLE_CLIENT_SECRET}

onelike.security.debugEnabled=true
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web.FilterChainProxy=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.data.redis=DEBUG


# ===============================
# = File upload
# ===============================
# Enable multipart uploads
spring.servlet.multipart.enabled=true
# Threshold after which files are written to disk.
spring.servlet.multipart.file-size-threshold=10MB
# Max file size.
spring.servlet.multipart.max-file-size=1024MB
# Max Request Size
spring.servlet.multipart.max-request-size=1024MB

#https://api.cloudflare.com/client/v4/accounts/YOUR_ACCOUNT_ID/images/v1
onelike.cloudflare.images.api=https://api.cloudflare.com/client/v4/accounts/8ab252d311445f5e3a06598b6da42471/images/v1
onelike.cloudflare.images.authorizationtoken=${CLOUDFLARE_IMAGES_TOKEN}
onelike.hibp.api-key=${HIBP_API_KEY}
onelike.webshare.api-key=${WEBSHARE_API_KEY}

spring.jackson.time-zone=Europe/Berlin

onelike.news.languages=English,Deutsch,Spanish,Francais,Greek,Hindi,Indonesian,Italian,Japanese,Dutch,Portuguese,Russian,Turkish,Arabic,Chinese