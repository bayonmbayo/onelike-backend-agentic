# Redis Configuration File

# Bind to all interfaces (allow external access)
bind 0.0.0.0

# Enable Append-Only Mode for persistence
appendonly no

# Save the DB every 60 seconds if at least 1 key has changed
save 60 1

# Set the maximum memory usage (optional)
maxmemory 256mb

# Log level
loglevel notice

# Specify the Redis working directory
dir /data